<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>손은수 | Product Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
      background: #f5f5f0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .title {
      text-align: center;
      line-height: 1.6;
    }

    .title h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.02em;
    }

    .title p {
      font-size: 15px;
      color: #666;
      margin-top: 4px;
    }

    .card-image {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    }

    .card-image img {
      width: 100%;
      display: block;
    }

    .download-btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.2s;
    }

    .download-btn:active {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">
      <h1>손은수</h1>
      <p>Product Manager · 플랫폼 서비스 기획자</p>
    </div>
    <div class="card-image">
      <img src="namecard.png" alt="손은수 명함">
    </div>
    <button class="download-btn" id="downloadBtn">명함 저장하기</button>
  </div>

  <script>
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = 'namecard.png';
      a.download = '손은수_명함.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });
  </script>
</body>
</html>
